<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <meta name="theme-color" content="#142018">

    <title>Angry Birds — The Asian Boy</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- ROTATE SCREEN -->

<div id="rotateScreen">

    <div class="rotate-symbol">
        ↻
    </div>

    <div class="rotate-title">
        ROTATE YOUR PHONE
    </div>

    <div class="rotate-text">
        Turn your phone sideways to play Angry Birds.
    </div>

</div>


<!-- GAME -->

<main id="game">


    <!-- TOP -->

    <header class="topbar">

        <button id="homeBtn">
            ← Home
        </button>

        <div class="gameTitle">
            ANGRY BIRDS
        </div>

        <div class="score">

            <span>
                SCORE
            </span>

            <strong id="score">
                0
            </strong>

        </div>

    </header>


    <!-- CANVAS -->

    <section id="gameArea">

        <canvas id="gameCanvas"></canvas>


        <!-- POWER -->

        <div id="power">

            <div class="powerText">
                POWER
            </div>

            <div class="powerTrack">

                <div id="powerFill"></div>

            </div>

        </div>


        <!-- MESSAGE -->

        <div
            id="message"
            class="hidden"
        >

            <div class="messageBox">

                <h1 id="messageTitle">
                    LEVEL COMPLETE
                </h1>

                <p id="messageText">
                    Nice shot.
                </p>

                <button id="nextBtn">
                    NEXT LEVEL
                </button>

            </div>

        </div>

    </section>


    <!-- BOTTOM -->

    <footer class="bottomBar">

        <div class="birdCounter">

            <span>
                BIRDS
            </span>

            <strong id="birdCount">
                ● ● ●
            </strong>

        </div>


        <button id="restartBtn">
            ↻ Restart
        </button>


        <button id="helpBtn">
            ?
        </button>

    </footer>


</main>


<!-- MATTER.JS -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>

<script src="script.js"></script>

</body>

</html>
